<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Adversarial review funnel</title>
  <desc id="desc">The review verified 1,205 candidate findings. Six hundred ninety-five survived initial verification. The review consolidated 149 high-severity root issues and retained 99 supported high or critical reports for responsible disclosure. Five hundred ten candidates were refuted initially, 35 high-severity verdicts changed in deep review, and one critical deep-dive was refuted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100e"/><stop offset="1" stop-color="#07051a"/></linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00d2c9"/><stop offset="1" stop-color="#5ff4ec"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00a89f"/><stop offset="1" stop-color="#8a78ff"/></linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#644df9"/><stop offset="1" stop-color="#ab9eff"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".04"/></pattern>
    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1600" height="900" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="24" fill="url(#dots)"/>
  <ellipse cx="920" cy="440" rx="520" ry="210" fill="#644df9" fill-opacity=".07" filter="url(#glow)"/>

  <text x="100" y="98" fill="#5ff4ec" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">ADVERSARIAL REVIEW FUNNEL</text>
  <text x="100" y="164" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="54" font-weight="600">Pressure-testing the findings</text>
  <text x="100" y="207" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="22">Every stage attempted to refute, consolidate or downgrade the stage before it.</text>

  <g transform="translate(100 286)">
    <text x="0" y="0" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">CANDIDATES VERIFIED</text>
    <text x="0" y="66" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="66" font-weight="700">1,205</text>
    <rect x="260" y="8" width="1080" height="58" rx="29" fill="#ffffff" fill-opacity=".035"/>
    <rect x="260" y="8" width="1080" height="58" rx="29" fill="url(#bar1)" fill-opacity=".88"/>
    <circle cx="1310" cy="37" r="8" fill="#f8f5ff"/>
  </g>

  <g transform="translate(100 432)">
    <text x="0" y="0" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">SURVIVED INITIAL VERIFICATION</text>
    <text x="0" y="66" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="66" font-weight="700">695</text>
    <rect x="260" y="8" width="1080" height="58" rx="29" fill="#ffffff" fill-opacity=".035"/>
    <rect x="260" y="8" width="623" height="58" rx="29" fill="url(#bar2)" fill-opacity=".9"/>
    <circle cx="853" cy="37" r="8" fill="#f8f5ff"/>
  </g>

  <g transform="translate(100 578)">
    <text x="0" y="0" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">HIGH-SEVERITY ROOTS DEEP-REVIEWED</text>
    <text x="0" y="66" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="66" font-weight="700">149</text>
    <rect x="260" y="8" width="1080" height="58" rx="29" fill="#ffffff" fill-opacity=".035"/>
    <rect x="260" y="8" width="300" height="58" rx="29" fill="url(#bar3)" fill-opacity=".92"/>
    <circle cx="530" cy="37" r="8" fill="#f8f5ff"/>
  </g>

  <g transform="translate(100 724)">
    <text x="0" y="0" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">SUPPORTED HIGH OR CRITICAL REPORTS</text>
    <text x="0" y="66" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="66" font-weight="700">99</text>
    <rect x="260" y="8" width="1080" height="58" rx="29" fill="#ffffff" fill-opacity=".035"/>
    <rect x="260" y="8" width="200" height="58" rx="29" fill="url(#bar3)"/>
    <circle cx="430" cy="37" r="8" fill="#f8f5ff"/>
    <text x="490" y="47" fill="#c2c4d4" font-family="Inter,Arial,sans-serif" font-size="20">Retained for coordinated disclosure</text>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(1080 400)">
      <rect width="360" height="92" rx="18" fill="#0c1a18" stroke="#5ff4ec" stroke-opacity=".25"/>
      <text x="24" y="37" fill="#5ff4ec" font-size="28" font-weight="700">510</text>
      <text x="94" y="36" fill="#c2c4d4" font-size="17">candidates refuted</text>
      <text x="24" y="66" fill="#5a7a78" font-size="15">during initial verification</text>
    </g>
    <g transform="translate(810 548)">
      <rect width="360" height="92" rx="18" fill="#0c1a18" stroke="#ab9eff" stroke-opacity=".28"/>
      <text x="24" y="37" fill="#ab9eff" font-size="28" font-weight="700">35 / 149</text>
      <text x="148" y="36" fill="#c2c4d4" font-size="17">verdicts changed</text>
      <text x="24" y="66" fill="#5a7a78" font-size="15">after source-level deep review</text>
    </g>
    <g transform="translate(570 694)">
      <rect width="360" height="92" rx="18" fill="#0c1a18" stroke="#ffd37a" stroke-opacity=".28"/>
      <text x="24" y="37" fill="#ffd37a" font-size="28" font-weight="700">1</text>
      <text x="56" y="36" fill="#c2c4d4" font-size="17">critical deep-dive refuted</text>
      <text x="24" y="66" fill="#5a7a78" font-size="15">and kept as a correction record</text>
    </g>
  </g>

  <text x="100" y="837" fill="#5a7a78" font-family="Inter,Arial,sans-serif" font-size="17">GLM-5.2 • approximately 2,332 agent assignments • 4.4B model tokens</text>
  <text x="1180" y="837" fill="#5a7a78" font-family="Inter,Arial,sans-serif" font-size="17">July 2026 • LibertAI Labs</text>
</svg>
