<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
  <title id="title">Projects and efforts analyzed in the post-quantum blockchain security review</title>
  <desc id="desc">Thirty core review targets grouped into seven live and deployed systems, thirteen migration and readiness efforts, and ten on-chain verifiers and libraries. Four additional projects from a separate preliminary web-only scan are QANplatform, Hedera, Nervos Network, and XDC Network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06100e"/>
      <stop offset=".55" stop-color="#050912"/>
      <stop offset="1" stop-color="#09051d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00d2c9"/>
      <stop offset=".5" stop-color="#5ff4ec"/>
      <stop offset="1" stop-color="#8a78ff"/>
    </linearGradient>
    <linearGradient id="count1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ff4ec"/><stop offset="1" stop-color="#00a89f"/></linearGradient>
    <linearGradient id="count2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4baff"/><stop offset="1" stop-color="#644df9"/></linearGradient>
    <linearGradient id="count3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ff4ec"/><stop offset="1" stop-color="#8a78ff"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".022"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1600" height="1150" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="1150" rx="26" fill="url(#grid)"/>
  <circle cx="180" cy="180" r="150" fill="#00d2c9" fill-opacity=".075" filter="url(#glow)"/>
  <circle cx="1430" cy="180" r="180" fill="#644df9" fill-opacity=".09" filter="url(#glow)"/>

  <text x="72" y="72" fill="#5ff4ec" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">POST-QUANTUM LANDSCAPE</text>
  <text x="72" y="132" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="50" font-weight="600">Every effort analyzed</text>
  <text x="72" y="174" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="21">Networks, roadmaps, proposals, implementations and recurring vulnerability classes</text>
  <rect x="72" y="207" width="1456" height="3" rx="1.5" fill="url(#line)" opacity=".72"/>

