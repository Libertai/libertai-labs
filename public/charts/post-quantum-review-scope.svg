<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Post-quantum blockchain review scope</title>
  <desc id="desc">Thirty efforts grouped into seven live or deployed systems, thirteen migration and readiness efforts, and ten on-chain verifiers and libraries. Six review lenses cover consensus, cryptography, key state, verification cost, denial of service, and governance and bridges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07100e"/>
      <stop offset="1" stop-color="#07051a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5ff4ec"/>
      <stop offset="1" stop-color="#00a89f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c4baff"/>
      <stop offset="1" stop-color="#644df9"/>
    </linearGradient>
    <linearGradient id="mixed" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5ff4ec"/>
      <stop offset="1" stop-color="#8a78ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="24" fill="url(#grid)"/>
  <circle cx="220" cy="190" r="170" fill="#00d2c9" fill-opacity=".08" filter="url(#glow)"/>
  <circle cx="1390" cy="250" r="210" fill="#644df9" fill-opacity=".1" filter="url(#glow)"/>

  <text x="100" y="98" fill="#5ff4ec" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">REVIEW SCOPE</text>
  <text x="100" y="164" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="54" font-weight="600">30 efforts across 3 domains</text>
  <text x="100" y="207" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="22">Deployment maturity was tracked separately from technical severity.</text>

  <g transform="translate(100 278)">
    <rect width="430" height="290" rx="22" fill="#0c1a18" fill-opacity=".9" stroke="#5ff4ec" stroke-opacity=".28"/>
    <circle cx="82" cy="82" r="42" fill="#00d2c9" fill-opacity=".09" stroke="#5ff4ec" stroke-opacity=".45"/>
    <path d="M58 84h48M82 60v48M65 67l34 34M99 67l-34 34" stroke="#5ff4ec" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    <text x="48" y="184" fill="url(#teal)" font-family="Satoshi,Inter,Arial,sans-serif" font-size="76" font-weight="700">7</text>
    <text x="140" y="164" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="27" font-weight="600">Live and deployed</text>
    <text x="140" y="198" fill="#c2c4d4" font-family="Inter,Arial,sans-serif" font-size="20">systems</text>
    <text x="48" y="248" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17">Networks, historical deployments</text>
    <text x="48" y="274" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17">and production PQ components</text>
  </g>

  <g transform="translate(585 278)">
    <rect width="430" height="290" rx="22" fill="#0c1a18" fill-opacity=".9" stroke="#ab9eff" stroke-opacity=".3"/>
    <circle cx="82" cy="82" r="42" fill="#644df9" fill-opacity=".1" stroke="#ab9eff" stroke-opacity=".5"/>
    <path d="M58 93c16-29 32-29 48 0M58 72c16 29 32 29 48 0" fill="none" stroke="#ab9eff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="48" y="184" fill="url(#violet)" font-family="Satoshi,Inter,Arial,sans-serif" font-size="76" font-weight="700">13</text>
    <text x="160" y="164" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="27" font-weight="600">Migration and</text>
    <text x="160" y="198" fill="#c2c4d4" font-family="Inter,Arial,sans-serif" font-size="20">readiness efforts</text>
    <text x="48" y="248" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17">Roadmaps, protocol proposals</text>
    <text x="48" y="274" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17">and standards guidance</text>
  </g>

  <g transform="translate(1070 278)">
    <rect width="430" height="290" rx="22" fill="#0c1a18" fill-opacity=".9" stroke="#61dcd8" stroke-opacity=".28"/>
    <circle cx="82" cy="82" r="42" fill="#644df9" fill-opacity=".08" stroke="#61dcd8" stroke-opacity=".45"/>
    <rect x="62" y="62" width="40" height="40" rx="8" fill="none" stroke="#61dcd8" stroke-width="2"/>
    <path d="M70 82h24M82 70v24" stroke="#ab9eff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="184" fill="url(#mixed)" font-family="Satoshi,Inter,Arial,sans-serif" font-size="76" font-weight="700">10</text>
    <text x="160" y="164" fill="#f8f5ff" font-family="Satoshi,Inter,Arial,sans-serif" font-size="27" font-weight="600">On-chain verifiers</text>
    <text x="160" y="198" fill="#c2c4d4" font-family="Inter,Arial,sans-serif" font-size="20">and libraries</text>
    <text x="48" y="248" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17">Contracts, precompiles, proving</text>
    <text x="48" y="274" fill="#93a0a3" font-family="Inter,Arial,sans-serif" font-size="17">systems and implementations</text>
  </g>

  <text x="100" y="648" fill="#5a7a78" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SIX ADVERSARIAL LENSES</text>
  <g font-family="Inter,Arial,sans-serif" font-size="18" fill="#c2c4d4">
    <g transform="translate(100 690)"><rect width="210" height="70" rx="35" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/><circle cx="35" cy="35" r="17" fill="#00d2c9" fill-opacity=".16"/><text x="35" y="42" fill="#5ff4ec" text-anchor="middle" font-weight="700">1</text><text x="68" y="42">Consensus</text></g>
    <g transform="translate(330 690)"><rect width="210" height="70" rx="35" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/><circle cx="35" cy="35" r="17" fill="#00d2c9" fill-opacity=".16"/><text x="35" y="42" fill="#5ff4ec" text-anchor="middle" font-weight="700">2</text><text x="68" y="42">PQ crypto</text></g>
    <g transform="translate(560 690)"><rect width="210" height="70" rx="35" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/><circle cx="35" cy="35" r="17" fill="#644df9" fill-opacity=".18"/><text x="35" y="42" fill="#ab9eff" text-anchor="middle" font-weight="700">3</text><text x="68" y="42">Key state</text></g>
    <g transform="translate(790 690)"><rect width="210" height="70" rx="35" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/><circle cx="35" cy="35" r="17" fill="#644df9" fill-opacity=".18"/><text x="35" y="42" fill="#ab9eff" text-anchor="middle" font-weight="700">4</text><text x="68" y="42">Verify cost</text></g>
    <g transform="translate(1020 690)"><rect width="210" height="70" rx="35" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/><circle cx="35" cy="35" r="17" fill="#00d2c9" fill-opacity=".16"/><text x="35" y="42" fill="#5ff4ec" text-anchor="middle" font-weight="700">5</text><text x="68" y="42">Network DoS</text></g>
    <g transform="translate(1250 690)"><rect width="250" height="70" rx="35" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/><circle cx="35" cy="35" r="17" fill="#644df9" fill-opacity=".18"/><text x="35" y="42" fill="#ab9eff" text-anchor="middle" font-weight="700">6</text><text x="68" y="31">Governance</text><text x="68" y="52">and bridges</text></g>
  </g>
  <text x="100" y="837" fill="#5a7a78" font-family="Inter,Arial,sans-serif" font-size="17">LibertAI Labs • Post-quantum blockchain security review • July 2026</text>
</svg>

